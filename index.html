<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Project 6.8</title>
</head>
<body>
    <header class="header">
        <div class="header__container">
            <div class="header__left">
                <button class="header__btn header__btn--options">
                    <img src="./images/options.svg" alt="CPS Options">
                </button>
                <a href="#" class="header__logo">
                    <img src="./images/cps_logo.svg" alt="CPS Logo">
                </a>
            </div>

            <div class="header__divider"></div>

            <div class="header__right">
                <button class="header__btn header__btn--phone">
                    <img src="./images/phone.svg" alt="CPS Telephone">
                </button>
                <button class="header__btn header__btn--chat">
                    <img src="./images/chat.svg" alt="CPS Chat">
                </button>
                <button class="header__btn header__btn--profile">
                    <img src="./images/profile.svg" alt="CPS Profile">
                </button>
                <button class="header__btn header__btn--settings">
                    <img src="./images/settings.svg" alt="CPS Settings">
                </button>
                <button class="header__btn header__btn--search">
                    <img src="./images/search.svg" alt="CPS Search">
                </button>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="main__container">
            <h1 class="main__title">Услуги и сервисы</h1>

            <nav class="main__nav">
                <ul class="main__menu">
                    <li class="main__item"><a href="#" class="main__link main__link--active">Ремонтируемые устройства</a></li>
                    <li class="main__item"><a href="#" class="main__link">Дополнительные услуги</a></li>
                    <li class="main__item"><a href="#" class="main__link">Цены на услуги</a></li>
                </ul>
            </nav>
        </div>

        <section class="about">
            <div class="about__content">
                <p class="about__text">
                    Мы являемся авторизованным сервисным центром по ремонту техники Dell. Только у нас вы можете отремонтировать свой ноутбук Dell с официальной гарантией производителя.
                </p>

                <button class="about__button">
                    <img src="./images/expand_arrow.svg" class="about__arrow" alt="CPS Arrow Right">
                    <span>Читать далее</span>
                </button>
            </div>

            <div class="about__image">
                <img src="./images/about_image.svg" alt="CPS About Image">
            </div>
        </section>
    </main>
</body>
</html>
